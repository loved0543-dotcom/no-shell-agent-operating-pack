name: Monitor Production Contract

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows: ["Publish MCP Registry"]
    types: [completed]

permissions:
  contents: read

jobs:
  live-contract:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Local contract checks
        run: |
          npm run selfcheck
          npm run test

      - name: Live production contract
        env:
          LIVE_CHECK_ATTEMPTS: "5"
          LIVE_CHECK_DELAY_SECONDS: "30"
        run: python validation/check_live_contract.py
